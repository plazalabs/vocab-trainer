<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="description" content="간격반복(SRS), 3종 퀴즈, 오답노트를 지원하는 고등 필수 영어 어휘 학습 PWA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="영단어 트레이너" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>수능·고등 영단어 트레이너 | 간격반복 어휘 학습</title>
  <script>
    // 첫 페인트 전 테마 적용 (깜빡임 방지) — vocab_trainer_prefs_v1.theme: 'system' | 'light' | 'dark'
    (function () {
      var theme = 'light';
      try {
        var p = JSON.parse(localStorage.getItem('vocab_trainer_prefs_v1') || '{}');
        if (p && (p.theme === 'light' || p.theme === 'dark')) theme = p.theme;
      } catch (e) {}
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <!-- 웹폰트 (DESIGN_REDESIGN.md 2장). 폴백 스택은 css/style.css의 --font-ko / --font-en / --font-num에 지정 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-group">
          <img src="./icons/icon.svg" alt="영단어 트레이너 로고" class="brand-logo" width="34" height="34" />
          <div>
            <h1 class="brand-title">고등 영단어 트레이너</h1>
            <span class="brand-subtitle">간격반복 · 3종 퀴즈 · 오답노트</span>
          </div>
        </div>
        <div class="header-badges">
          <button id="btn-pwa-install" class="install-btn" type="button" aria-label="앱 설치하기">
            <span>앱 설치</span>
          </button>
          <div id="header-streak-badge" class="streak-pill" title="연속 학습일">
            <span aria-hidden="true">🔥</span>
            <span id="header-streak-text">0일 연속</span>
          </div>
          <div id="header-level-badge" class="level-pill" title="레벨 · 누적 XP">
            <span aria-hidden="true">⚡</span>
            <span id="header-level-text">Lv.1 · 0 XP</span>
          </div>
          <button id="btn-toggle-sound" class="icon-toggle-btn" type="button" aria-label="효과음 켜기/끄기" title="효과음 켜기/끄기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg></button>
          <button id="btn-toggle-theme" class="icon-toggle-btn" type="button" aria-label="다크 모드 전환" title="다크 모드 전환"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg></button>
        </div>
      </div>
    </header>

          </p>
          </div>
        </div>

        <div id="wordbook-list" class="word-list" aria-live="polite"></div>
      </section>

      <!-- 3. 퀴즈 화면 (Quiz View) -->
      <section id="view-quiz" class="view-section" aria-label="퀴즈 화면">
        <div class="quiz-config-bar">
          <div class="quiz-config-collapsed">
            <span class="quiz-collapsed-mode" id="quiz-collapsed-mode-label">퀴즈 진행 중</span>
            <button class="mini-btn" type="button" id="btn-quiz-settings">설정 열기</button>
          </div>
          <div class="quiz-group-caption">기본 퀴즈 3종 (샘플 24단어)</div>
          <div class="quiz-tabs" role="tablist" aria-label="퀴즈 유형 선택">
            <button class="quiz-tab-btn active" type="button" data-quiz-mode="meaning" id="tab-quiz-meaning">
              (a) 뜻 맞히기
            </button>
            <button class="quiz-tab-btn" type="button" data-quiz-mode="blank" id="tab-quiz-blank">
              (b) 예문 빈칸
            </button>
            <button class="quiz-tab-btn" type="button" data-quiz-mode="flashcard" id="tab-quiz-flashcard">
              (c) 카드 뒤집기
            </button>
          </div>

          <div class="quiz-group-caption exam-caption">기출 모드 (수능·모의고사 다의어 40단어)</div>
          <div class="quiz-tabs exam-quiz-tabs" role="tablist" aria-label="기출 모드 유형 선택">
            <button class="quiz-tab-btn exam-tab-btn" type="button" data-quiz-mode="exam-blank" id="tab-quiz-exam-blank">
              유형 1 · 기출 예문 빈칸
            </button>
            <button class="quiz-tab-btn exam-tab-btn" type="button" data-quiz-mode="exam-meaning" id="tab-quiz-exam-meaning">
              유형 2 · 문맥 속 뜻
            </button>
          </div>

          <div class="quiz-scope-row">
            <label for="quiz-scope-select" class="quiz-scope-label">
              출제 범위:
            </label>
            <select id="quiz-scope-select" class="scope-select" aria-label="퀴즈 출제 범위">
              <option value="today">오늘 복습 + 미학습 단어 (추천)</option>
              <option value="all">전체 단어 24개</option>
              <option value="wrong">오답노트 단어만</option>
            </select>
            <button id="btn-restart-quiz" class="mini-btn" type="button">다시 섞기</button>
          </div>
        </div>

        <div id="quiz-active-area"></div>
        <div id="quiz-feedback-banner" class="quiz-feedback-banner hidden" role="status" aria-live="polite"></div>
      </section>

      <!-- 4. 오답노트 화면 (Wrong Answer Note View) -->
      <section id="view-wrong" class="view-section" aria-label="오답노트 화면">
        <div id="wrong-note-header"></div>
        <div id="wrong-note-list" class="word-list" aria-live="polite"></div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <div class="bottom-nav-inner">
        <button class="nav-item active" type="button" data-nav-target="home" id="nav-btn-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z" />
          </svg>
          <span>홈</span>
        </button>

        <button class="nav-item" type="button" data-nav-target="wordbook" id="nav-btn-wordbook">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </svg>
          <span>단어장</span>
        </button>

        <button class="nav-item" type="button" data-nav-target="quiz" id="nav-btn-quiz">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <span>퀴즈 3종</span>
        </button>

        <button class="nav-item" type="button" data-nav-target="wrong" id="nav-btn-wrong">
          <span id="nav-wrong-badge" class="nav-badge hidden">0</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="9" y1="13" x2="15" y2="13" />
            <line x1="9" y1="17" x2="13" y2="17" />
          </svg>
          <span>오답노트</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="./js/app.js"></script>
</body>
</html>
